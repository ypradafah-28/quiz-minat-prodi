<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kuis prediksi minat jurusan - jawab 5 pertanyaan sesi 1 untuk menemukan rumpun minatmu, lalu 5 pertanyaan sesi 2 untuk menemukan 5 prodi terbaik." />
  <title>Quiz Minat Prodi · Temukan Rumpun &amp; Prodi Favoritmu</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Roboto", "ui-sans-serif", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- CSS kustom: animasi & tema biru-putih -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Latar belakang dekoratif (blob biru melayang) ===== -->
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- ===== Kanvas animasi petasan (muncul saat hasil ditampilkan) ===== -->
  <canvas id="canvas-petasan" aria-hidden="true"></canvas>

  <!-- ===== 1 LAYAR UTAMA : semua bagian muncul bergantian di kartu ini ===== -->
  <main class="relative z-10 flex min-h-screen w-full items-center justify-center px-4 py-10">
    <div class="card-main w-full max-w-2xl">

      <!-- ===== LAYAR A: BERANDA (tombol Mulai) ===== -->
      <section id="section-start" class="quiz-section anim-masuk">
        <div class="text-center">
          <div class="badge-logo mx-auto">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 10 12 5 2 10l10 5 10-5z" />
              <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5" />
              <path d="M22 10v6" />
            </svg>
          </div>
          <h1 class="title-main">Quiz Minat Prodi</h1>

          <div class="rumpun-chips">
            <span class="chip chip-r1">Saintek, Kesehatan, Agro</span>
            <span class="chip chip-r2">Soshum dan Bisnis</span>
            <span class="chip chip-r3">Seni dan Budaya</span>
          </div>

          <button id="btn-mulai" type="button" class="btn-primary">
            Mulai
          </button>
        </div>
      </section>

      <!-- ===== LAYAR B: KUIS (Sesi 1 & Sesi 2 memakai layar yang sama) ===== -->
      <section id="section-quiz" class="quiz-section hidden">
        <div class="quiz-top">
          <button id="btn-kembali" type="button" class="btn-kembali" title="Kembali ke awal kuis">← Kembali</button>
          <span id="sesi-badge" class="sesi-badge">Peminatan</span>
          <span id="soal-progress" class="progress-text">Soal 1/5</span>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>
        <h2 id="soal-text" class="soal-text"></h2>
        <div id="soal-options" class="soal-options"></div>
      </section>

      <!-- ===== LAYAR C: ANALISIS (teks menyesuaikan sesi) ===== -->
      <section id="section-analyzing" class="quiz-section hidden">
        <div class="text-center py-8">
          <div class="spinner"></div>
          <h2 id="analis-judul" class="title-sub">Menentukan rumpun minatmu<span class="dot-anim"><span>.</span><span>.</span><span>.</span></span></h2>
        </div>
      </section>

      <!-- ===== LAYAR D: HASIL RUMPUN SESI 1 (1 pemenang rumpun) ===== -->
      <section id="section-rumpun" class="quiz-section hidden">
        <div class="text-center">
          <h2 class="title-main-2">Rumpun Minatmu</h2>
          
        </div>
        <div id="rumpun-list" class="mt-6 space-y-3"></div>
        <button id="btn-sesi2" type="button" class="btn-primary mt-8 w-full">
          Lanjut ke Sesi 2 →
        </button>
      </section>

      <!-- ===== LAYAR E: HASIL AKHIR (Top 5 Prodi) ===== -->
      <section id="section-result" class="quiz-section hidden">
        <div class="text-center">
          <h2 class="title-main-2">Hasil Prediksi Minat</h2>
          <p class="subtitle">Inilah <strong>5 prodi</strong> yang paling cocok dengan minatmu</p>
        </div>
        <div id="result-list" class="mt-6 space-y-3"></div>
        <button id="btn-ulangi" type="button" class="btn-primary mt-8 w-full">
          Ulangi Kuis
        </button>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
